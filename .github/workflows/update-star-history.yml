name: Update Star History

on:
  schedule:
    - cron: '0 0 * * 0'   # every Sunday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate star history chart
        uses: star-history/star-history@v0
        with:
          repositories: '${{ github.repository }}'
          output: 'star-history.svg'
      - name: Push to star-history branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add star-history.svg
          git commit -m "docs: update star history" || echo "nothing to commit"
          git push --force "https://${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:star-history
